version: 1
type: metrics_view 

display_name: Model Metrics
model: model
timeseries: created_at

measures:
  - name: average_value_measure
    display_name: Average Value
    expression: AVG(value)
    description: The average value across all models.
    format_preset: humanize
  - name: total_value_measure
    display_name: Total Value
    expression: SUM(value)
    description: The sum of all values in the models.
    format_preset: humanize
  - name: count_fellow
    display_name: count_fellow
    expression: COUNT(DISTINCT owner)
    description: The number of unique FLs in the dataset.
    format_preset: humanize

  - name: has_metric
    display_name: Has Metric
    expression: COUNT(value)
    description: Count of rows where value is not null. Slice by metric_type using the dimension.
    format_preset: humanize
  
  
dimensions:
  - name: period
    display_name: Period
    column: period
